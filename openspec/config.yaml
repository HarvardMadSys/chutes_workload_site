schema: spec-driven

# Project context, shown to AI when creating artifacts.
context: |
  The Chutes trace site: a public, static, lightweight website for the
  one-year Chutes production LLM-serving trace of the paper "A Year in LLM
  Serving: Workload Evolution, Caching and Load-Balancing". It has the
  layout and look of the FreeInference agentic trace site: a hero with a
  stats strip, an Overview of two mixes (by family and by endpoint), a
  Traffic Explorer of requests or tokens per day by family, model and
  endpoint over a chosen range of days, with the chosen requests' token
  and TTFT distributions, the Insights' figure cards in six topic tabs,
  Cite and Team. Every chart is drawn in the browser by Observable Plot
  from small JSON answers: the Overview, the stats and the explorer from
  answers a Python step computes from the artifact's committed query
  caches and from the site's trace table, the Insights' cards from the
  artifact's plot-ready figure answers. The 91 GB trace is read once, by
  `make tables`, to build the trace table (tables/weekly_histograms.parquet,
  weekly histograms of input tokens, output tokens and TTFT, tracked);
  nothing else reads it. There is no server, no database in the browser
  and no front-end build step. The artifact repository (chutes_workload)
  owns every definition; this site reads its caches and only filters,
  counts and draws, but for the trace query, which applies the
  artifact's family rule and is checked against the artifact's daily
  rollup.

  Engineering rules (binding; see openspec/specs/site):
  - It MUST NOT be complicated. Simple, readable and maintainable first.
  - No premature optimisation: plainest correct code; speed up only after a
    measured run shows it is too slow, and record the measurement.
  - No framework, no bundler, no npm runtime dependency: plain HTML, CSS and
    ES modules; libraries are loaded from a CDN at pinned versions.
  - Names are words; a one-letter name is only a loop index; imports without
    aliases (Python) and named imports (JS).
  - A function is at most 50 lines, a module at most 300.
  - SQL is a literal, one query per file, with no string assembly.
  - Every module is tested; make test passes at every commit.

rules:
  proposal:
    - Say why and what in plain words; do not repeat the spec's rules.
    - Prefer the simpler definition; say what it moves.
  design:
    - Open with the engineering rules above, then decisions and alternatives.
    - Any speed-up must cite a measurement.
  specs:
    - Define behaviour, not implementation tricks.
  tasks:
    - One task per unit of work, each with how it is verified.

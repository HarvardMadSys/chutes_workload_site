name: Deploy

# Deploys site/ to Cloudflare as the Worker's static assets on every push to main, once the test job has passed, with
# wrangler and an API token, so no Cloudflare dashboard role beyond Workers Platform Admin is needed. The repository's
# owner adds the two secrets under the repository's Settings > Secrets and variables > Actions: CLOUDFLARE_API_TOKEN (a
# token with Workers Scripts: Edit, from the dashboard's "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
# The repository variable CLOUDFLARE_ACCOUNT_SUBDOMAIN, set there too, turns on the check of the published site.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one rather than cancelling it mid-upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The whole suite on a fresh machine, as `make test` runs it: the Python tests, the node tests, and the snapshot test,
  # which opens the page in Chromium. ARTIFACT is empty, as the artifact's checkout is not here: the tests that need it
  # skip, and every other test runs.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: make setup

      - run: .venv/bin/python -m playwright install --with-deps chromium

      - run: make test ARTIFACT=

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Check the deployed site answers
        shell: bash
        run: |
          # The Worker answers at its workers.dev address until a custom domain is set in wrangler.jsonc. The check is
          # that the page, the daily by-family answer, the histogram answer by family and one figure answer are served,
          # each with its content type.
          host="chutes-trace-site.${CLOUDFLARE_ACCOUNT_SUBDOMAIN:-}.workers.dev"
          if [ -z "${CLOUDFLARE_ACCOUNT_SUBDOMAIN:-}" ]; then
            echo "::warning::The deployed site was not checked: set the CLOUDFLARE_ACCOUNT_SUBDOMAIN repository variable to check it."
            exit 0
          fi
          # Fails the job unless the path answers 200 with a content type that starts with the expected one.
          # curl prints 000 and no type when it cannot connect, which fails the check like any other answer.
          check_answer() {
            local path="$1" expected_type="$2" answer status content_type
            answer=$(curl -s -o /dev/null -L -w '%{http_code} %{content_type}' "https://$host$path") || true
            status="${answer%% *}"
            content_type="${answer#* }"
            if [ "$status" != "200" ]; then
              echo "::error::$path on $host answered $status"
              exit 1
            fi
            case "$content_type" in
              "$expected_type"*) echo "$path answered 200, $content_type" ;;
              *) echo "::error::$path on $host answered with content type '$content_type', not $expected_type"; exit 1 ;;
            esac
          }
          check_answer "/" "text/html"
          check_answer "/data/all/explore/daily_by_family.json" "application/json"
          check_answer "/data/all/explore/histograms_by_family.json" "application/json"
          check_answer "/data/all/figures/fig_request_rate_day.json" "application/json"
        env:
          CLOUDFLARE_ACCOUNT_SUBDOMAIN: ${{ vars.CLOUDFLARE_ACCOUNT_SUBDOMAIN }}
